<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voix — luisterboek leren</title>
<style>
  :root {
    --paper: #f5efe3; --paper-2: #fbf7ee; --ink: #1e1a15; --ink-soft: #8d8576; --line: #e2d9c7;
    --accent: #b8472a; --accent-ink: #fff; --mark: rgba(244, 180, 60, .55);
    --you: #0f766e; --you-mark: rgba(45, 180, 165, .32);
    --glow-1: rgba(184, 71, 42, .10); --glow-2: rgba(15, 118, 110, .08);
    --shadow: 0 18px 50px -18px rgba(60, 40, 10, .35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #13110e; --paper-2: #1c1915; --ink: #f0e9dc; --ink-soft: #857d6f; --line: #302b24;
      --accent: #ef8f5e; --accent-ink: #1a0f08; --mark: rgba(240, 165, 55, .38);
      --you: #5fd0c0; --you-mark: rgba(95, 208, 192, .26);
      --glow-1: rgba(239, 143, 94, .10); --glow-2: rgba(95, 208, 192, .07);
      --shadow: 0 18px 50px -18px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 var(--sans);
    background:
      radial-gradient(60vw 50vh at 12% -5%, var(--glow-1), transparent 70%),
      radial-gradient(55vw 50vh at 95% 105%, var(--glow-2), transparent 70%),
      var(--paper);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: default; opacity: .35; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* --- Kop ----------------------------------------------------------------- */
  #bookbar { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 5; }
  #bookbar i { display: block; height: 100%; width: 0; background: var(--accent);
               transition: width .5s cubic-bezier(.2, .7, .2, 1); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           max-width: 1040px; margin: 0 auto; padding: 22px 24px 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; font: 600 1.35rem/1 var(--serif);
           letter-spacing: -.01em; }
  .brand em { font: 500 .72rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase;
              color: var(--ink-soft); font-style: normal; }
  .brand b { color: var(--accent); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--paper-2); font-size: .82rem;
          transition: border-color .2s, transform .2s; }
  button.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .head-right { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: .82rem; }
  .uilang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .uilang button { padding: 4px 9px; border-radius: 999px; font: 600 .7rem var(--sans); letter-spacing: .06em;
                   color: var(--ink-soft); }
  .uilang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  main { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* --- Lezen --------------------------------------------------------------- */
  #player { padding: 6vh 0 250px; }
  .ctx { display: block; width: 100%; text-align: left; font: 1.02rem/1.55 var(--serif);
         color: var(--ink-soft); opacity: .55; padding: 6px 0; transition: opacity .2s;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ctx:hover { opacity: 1; }
  .ctx:empty { visibility: hidden; }

  #stage { padding: 30px 0 26px; }
  #badge { display: flex; align-items: center; gap: 10px; height: 20px; margin-bottom: 26px;
           font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
           color: var(--ink-soft); transition: color .3s; }
  body[data-state="playing"] #badge { color: var(--accent); }
  body[data-state="silent"] #badge { color: var(--you); }

  .eq { display: none; align-items: flex-end; gap: 2px; height: 12px; }
  .eq i { width: 3px; height: 100%; background: currentColor; border-radius: 2px;
          transform-origin: bottom; animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.35s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .eq i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  body[data-state="playing"] .eq { display: flex; }
  .dot { display: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor;
         animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--you-mark); } 100% { box-shadow: 0 0 0 12px transparent; } }
  body[data-state="silent"] .dot { display: block; }

  #words { display: flex; flex-wrap: wrap; gap: 1.05em .12em;
           font: clamp(1.55rem, 1.05rem + 1.7vw, 2.45rem)/1.2 var(--serif); letter-spacing: -.005em; }
  .w { display: flex; flex-direction: column; align-items: center; scroll-margin: 120px 0 260px;
       animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .w .src { padding: .04em .17em; border-radius: .22em; color: var(--ink-soft);
            background: linear-gradient(var(--hl), var(--hl)) no-repeat left / 0 100%;
            transition: color .3s; --hl: var(--mark); }
  body[data-state="silent"] .w .src { --hl: var(--you-mark); }
  .w.seen .src { color: var(--ink); }
  .w.now .src { color: var(--ink); background-size: calc(var(--p, 0) * 100%) 100%; }
  .w .nl { font: 500 .36em/1.3 var(--sans); letter-spacing: .01em; color: var(--accent);
           margin-top: .5em; min-height: 1.3em; white-space: nowrap;
           opacity: 0; transform: translateY(-5px); transition: opacity .35s, transform .35s; }
  .w.seen .nl { opacity: 1; transform: none; }
  .w.verb { cursor: help; }
  .w.verb .src { text-decoration: underline dotted 1.5px color-mix(in srgb, var(--accent) 60%, transparent);
                 text-underline-offset: .24em; }

  /* Vervoegingskaart bij een werkwoord */
  #pop { position: fixed; z-index: 6; pointer-events: none; width: max-content; max-width: calc(100vw - 24px);
         padding: 16px 18px 14px; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow);
         background: var(--paper-2); animation: rise .18s cubic-bezier(.2, .7, .2, 1); }
  #pop h3 { margin: 0 0 12px; font: 600 1.25rem/1 var(--serif); display: flex; align-items: baseline; gap: 10px; }
  #pop h3 small { font: 600 .64rem var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  #pop .grid { display: grid; grid-template-columns: repeat(6, auto); gap: 14px 24px; }
  @media (max-width: 980px) { #pop .grid { grid-template-columns: repeat(3, auto); } }
  #pop h4 { margin: 0 0 4px; font: 600 .64rem var(--sans); letter-spacing: .12em; text-transform: uppercase;
            color: var(--accent); }
  #pop ul { list-style: none; margin: 0; padding: 0; font: .92rem/1.5 var(--serif); }
  #pop li { display: flex; gap: 7px; white-space: nowrap; padding: 0 5px; margin: 0 -5px; border-radius: 5px; }
  #pop li span { color: var(--ink-soft); min-width: 3.1em; }
  #pop li.hit { background: var(--mark); font-weight: 600; }
  #pop .extra { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line);
                font-size: .8rem; color: var(--ink-soft); }
  #pop .extra b { font: 600 .92rem var(--serif); color: var(--ink); }
  #pop .extra b.hit { background: var(--mark); border-radius: 4px; padding: 0 4px; }

  #words.pending .src { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }

  #full { margin: 34px 0 0; padding-left: 18px; border-left: 2px solid var(--accent); max-width: 62ch;
          font: italic 1.08rem/1.6 var(--serif); color: var(--ink);
          opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; }
  #full.show { opacity: .85; transform: none; }
  #status { margin: 18px 0 0; color: #c0392b; white-space: pre-wrap; font-size: .9rem; }
  #status:empty { display: none; }

  /* --- Bediening ----------------------------------------------------------- */
  #dock { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 4;
          width: min(780px, calc(100vw - 24px)); padding: 14px 22px 16px; border-radius: 26px;
          border: 1px solid var(--line); box-shadow: var(--shadow);
          background: color-mix(in srgb, var(--paper-2) 82%, transparent);
          -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }
  .scrub { display: flex; align-items: center; gap: 14px; font-size: .78rem; color: var(--ink-soft);
           font-variant-numeric: tabular-nums; }
  #speed { font: inherit; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line);
           border-radius: 8px; padding: 3px 6px; cursor: pointer; }
  .scrub input { flex: 1; height: 16px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
  .scrub input::-webkit-slider-runnable-track { height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--line) var(--fill, 0%)); }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--paper-2); cursor: pointer; }
  .scrub input::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line); }
  .scrub input::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--accent); }
  .scrub input::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--paper-2); cursor: pointer; }

  .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; }
  .btns { display: flex; align-items: center; gap: 6px; }
  .ib { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 58px;
        padding: 7px 6px 5px; border-radius: 14px; font-size: .66rem; letter-spacing: .04em;
        color: var(--ink-soft); transition: background .2s, color .2s, transform .15s; }
  .ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7;
            stroke-linecap: round; stroke-linejoin: round; }
  .ib:not(:disabled):hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
  .ib:not(:disabled):active { transform: scale(.94); }
  #silent:not(:disabled):hover, body[data-state="silent"] #silent { color: var(--you); }

  #toggle { position: relative; width: 68px; height: 68px; margin: 0 10px; border-radius: 50%;
            background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
            box-shadow: 0 8px 22px -8px var(--accent); transition: transform .15s, background .3s, box-shadow .3s; }
  body[data-state="silent"] #toggle { background: var(--you); box-shadow: 0 8px 22px -8px var(--you); }
  #toggle:not(:disabled):hover { transform: scale(1.05); }
  #toggle:not(:disabled):active { transform: scale(.96); }
  #toggle svg.icon { width: 26px; height: 26px; fill: currentColor; }
  #toggle .i-pause, body[data-state="playing"] #toggle .i-play, body[data-state="silent"] #toggle .i-play { display: none; }
  body[data-state="playing"] #toggle .i-pause, body[data-state="silent"] #toggle .i-pause { display: block; }
  #toggle .ring { position: absolute; inset: -7px; width: 82px; height: 82px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring .track { stroke: var(--line); }
  .ring .prog { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 245; stroke-dashoffset: 245;
                transition: stroke .3s; }
  body[data-state="silent"] .ring .prog { stroke: var(--you); }

  .switch { justify-self: start; white-space: nowrap; display: flex; align-items: center; gap: 9px; font-size: .78rem;
            color: var(--ink-soft); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch i { width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative;
              transition: background .2s; flex: none; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
                     border-radius: 50%; background: var(--paper-2); transition: transform .2s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(14px); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 3px; }
  .keys { justify-self: end; white-space: nowrap; }
  kbd { font: 600 .68rem var(--sans); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line);
        background: var(--paper); }

  /* --- Boek kiezen --------------------------------------------------------- */
  #setup { max-width: 720px; margin: 0 auto; padding: 9vh 0 60px; }
  #setup h1 { font: 500 clamp(2.2rem, 1.4rem + 3.4vw, 3.6rem)/1.08 var(--serif); letter-spacing: -.02em; margin: 0 0 18px; }
  #setup h1 i { color: var(--accent); }
  #setup .lead { font: 1.12rem/1.6 var(--serif); color: var(--ink-soft); margin: 0 0 34px; max-width: 54ch; }
  #books { display: grid; gap: 12px; }
  .book { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%;
          text-align: left; padding: 18px 22px; border-radius: 18px; background: var(--paper-2);
          border: 1px solid var(--line); box-shadow: var(--shadow); transition: border-color .2s, transform .2s; }
  .book:hover { border-color: var(--accent); transform: translateY(-1px); }
  .book b { display: block; font: 600 1.2rem/1.3 var(--serif); }
  .book span { font-size: .84rem; color: var(--ink-soft); }
  .book i { font-style: normal; font-size: .84rem; color: var(--accent); white-space: nowrap; }
  #setupStatus { color: var(--ink-soft); font: 1.05rem/1.6 var(--serif); }
  #setupStatus:empty { display: none; }
  .beheer { display: inline-block; margin-top: 34px; font-size: .8rem; color: var(--ink-soft); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 40px; }
  .steps div { font-size: .88rem; color: var(--ink-soft); }
  .steps b { display: block; font: 600 1.02rem var(--serif); color: var(--ink); margin-bottom: 4px; }
  .steps span:first-child { font: 600 .7rem var(--sans); letter-spacing: .14em; color: var(--accent); }

  @media (max-width: 640px) {
    header { padding: 16px 16px 0; } main { padding: 0 16px; }
    .brand em, .keys, .switch span, .ib span { display: none; }
    .ib { min-width: 46px; } #toggle { margin: 0 4px; }
    .row { grid-template-columns: auto auto auto; justify-content: space-between; }
    .steps { grid-template-columns: 1fr; gap: 14px; }
    #pop .grid { grid-template-columns: repeat(2, auto); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-state="idle">
<div id="bookbar"><i id="bar"></i></div>

<header>
  <div class="brand">Voix<b>.</b> <em data-i18n="tagline"></em></div>
  <div class="head-right">
    <span id="meta"></span>
    <button class="chip" id="otherBook" data-i18n="otherBook" hidden></button>
    <div class="uilang" role="group" aria-label="Language / Taal">
      <button data-ui="nl">NL</button><button data-ui="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section id="setup" hidden>
    <h1 data-i18n-html="heroTitle"></h1>
    <p class="lead" data-i18n="heroLead"></p>
    <div id="books"></div>
    <p id="setupStatus"></p>
    <div class="steps">
      <div><span>01</span><b data-i18n="step1"></b><span data-i18n="step1Text"></span></div>
      <div><span>02</span><b data-i18n="step2"></b><span data-i18n="step2Text"></span></div>
      <div><span>03</span><b data-i18n="step3"></b><span data-i18n="step3Text"></span></div>
    </div>
    <a class="beheer" href="/admin" data-i18n="admin"></a>
  </section>

  <section id="player" hidden>
    <button class="ctx" id="ctxPrev" data-i18n-title="ctxPrev"></button>
    <div id="stage">
      <div id="badge"><span class="eq"><i></i><i></i><i></i><i></i></span><span class="dot"></span><span id="badgeText"></span></div>
      <div id="words"></div>
      <p id="full"></p>
      <p id="status"></p>
    </div>
    <button class="ctx" id="ctxNext" data-i18n-title="ctxNext"></button>
  </section>
</main>

<div id="pop" hidden></div>

<footer id="dock" hidden>
  <div class="scrub">
    <input type="range" id="seek" min="0" value="0" data-i18n-aria="seek">
    <span id="count"></span>
    <select id="speed" data-i18n-aria="speed" data-i18n-title="speed">
      <option value="0.6">0,6×</option>
      <option value="0.75">0,75×</option>
      <option value="0.85">0,85×</option>
      <option value="1">1×</option>
      <option value="1.15">1,15×</option>
    </select>
  </div>
  <div class="row">
    <label class="switch" data-i18n-title="stopEachTitle">
      <input type="checkbox" id="stopEach" checked><i></i><span data-i18n="stopEach"></span></label>
    <div class="btns">
      <button class="ib" id="prev" data-i18n-title="prevTitle">
        <svg viewBox="0 0 24 24"><path d="M19 5v14l-10-7z"/><path d="M5 5v14"/></svg><span data-i18n="prev"></span></button>
      <button class="ib" id="silent" data-i18n-title="silentTitle">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-i18n="silent"></span></button>
      <button id="toggle" data-i18n-title="toggleTitle" data-i18n-aria="toggle">
        <svg class="ring" viewBox="0 0 82 82"><circle class="track" cx="41" cy="41" r="39"/><circle class="prog" id="ring" cx="41" cy="41" r="39"/></svg>
        <svg class="icon i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="icon i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
      </button>
      <button class="ib" id="again" data-i18n-title="againTitle">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg><span data-i18n="again"></span></button>
      <button class="ib" id="next" data-i18n-title="nextTitle">
        <svg viewBox="0 0 24 24"><path d="M5 5v14l10-7z"/><path d="M19 5v14"/></svg><span data-i18n="next"></span></button>
    </div>
    <div class="keys"><kbd data-i18n="space"></kbd> <kbd>S</kbd> <kbd>R</kbd> <kbd>←</kbd> <kbd>→</kbd></div>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const audio = new Audio();
// Leessnelheid: onthouden; de toonhoogte blijft gelijk. defaultPlaybackRate zorgt dat een nieuwe zin hem overneemt.
function setSpeed(v) {
  audio.defaultPlaybackRate = audio.playbackRate = v;
  try { localStorage.setItem("speed", v); } catch {}
}
{
  let saved = "1";
  try { saved = localStorage.getItem("speed") || "1"; } catch {}
  if (![...$("speed").options].some((o) => o.value === saved)) saved = "1";
  $("speed").value = saved;
  setSpeed(Number(saved));
}
$("speed").addEventListener("change", (e) => { setSpeed(Number(e.target.value)); e.target.blur(); });
// --- Taal van de pagina (Nederlands of Engels) -------------------------------

const TEXT = {
  nl: {
    tagline: "luisterboek leren", otherBook: "Ander boek", admin: "Beheer",
    heroTitle: "Leer een taal door te <i>luisteren</i> en mee te lezen.",
    heroLead: "Kies een boek. Je hoort het voorgelezen, ziet elk woord oplichten en krijgt de betekenis er direct onder.",
    step1: "Luister", step1Text: "Elke zin wordt voorgelezen terwijl de woorden oplichten.",
    step2: "Begrijp", step2Text: "Onder elk woord verschijnt de betekenis in deze zin.",
    step3: "Spreek mee", step3Text: "Herhaal de zin stil en oefen zelf de uitspraak.",
    ctxPrev: "Naar de vorige zin", ctxNext: "Naar de volgende zin",
    seek: "Positie in het boek", speed: "Leessnelheid",
    stopEach: "Pauze na elke zin", stopEachTitle: "Stop na elke zin, zodat je kunt herhalen",
    prev: "Vorige", prevTitle: "Vorige zin (←)", silent: "Stil", silentTitle: "Stil herhalen: spreek zelf mee (S)",
    toggle: "Afspelen of pauzeren", toggleTitle: "Afspelen / pauze (spatie)",
    again: "Opnieuw", againTitle: "Opnieuw met geluid (R)", next: "Volgende", nextTitle: "Volgende zin (→)",
    space: "spatie",
    failed: "Er ging iets mis", loading: "Zin laden…", playing: "Luister", yourTurn: "Jouw beurt — spreek mee",
    end: "Einde van de tekst", spaceNext: "Spatie voor de volgende zin", paused: "Gepauzeerd",
    spacePlay: "Spatie om te luisteren", verb: "werkwoord",
    sentences: "zinnen", start: "Begin met lezen", resume: "Verder bij zin {n}",
    noBooks: "Er zijn nog geen boeken beschikbaar.",
  },
  en: {
    tagline: "learn with audiobooks", otherBook: "Other book", admin: "Admin",
    heroTitle: "Learn a language by <i>listening</i> and reading along.",
    heroLead: "Choose a book. You hear it read aloud, see each word light up and get its meaning right below it.",
    step1: "Listen", step1Text: "Each sentence is read aloud while the words light up.",
    step2: "Understand", step2Text: "Below each word you see what it means in this sentence.",
    step3: "Speak along", step3Text: "Replay the sentence silently and practise the pronunciation yourself.",
    ctxPrev: "Go to the previous sentence", ctxNext: "Go to the next sentence",
    seek: "Position in the book", speed: "Reading speed",
    stopEach: "Pause after each sentence", stopEachTitle: "Stop after each sentence, so you can repeat it",
    prev: "Previous", prevTitle: "Previous sentence (←)", silent: "Silent", silentTitle: "Replay silently: speak along (S)",
    toggle: "Play or pause", toggleTitle: "Play / pause (space)",
    again: "Again", againTitle: "Replay with sound (R)", next: "Next", nextTitle: "Next sentence (→)",
    space: "space",
    failed: "Something went wrong", loading: "Loading sentence…", playing: "Listen", yourTurn: "Your turn — speak along",
    end: "End of the text", spaceNext: "Space for the next sentence", paused: "Paused",
    spacePlay: "Space to listen", verb: "verb",
    sentences: "sentences", start: "Start reading", resume: "Continue at sentence {n}",
    noBooks: "There are no books available yet.",
  },
};
let ui = "nl";
try { if (TEXT[localStorage.getItem("ui")]) ui = localStorage.getItem("ui"); } catch {}
const t = (key, vars = {}) => TEXT[ui][key].replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const langName = (code) => new Intl.DisplayNames([ui], { type: "language" }).of(code);
// De vertaling onder de woorden: in de taal van de pagina als het boek die heeft, anders de eerste van het boek.
const glossLang = () => (book.targets.includes(ui) ? ui : book.targets[0]);

function applyLang() {
  document.documentElement.lang = ui;
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-html]")) e.innerHTML = t(e.dataset.i18nHtml);
  for (const e of document.querySelectorAll("[data-i18n-title]")) e.title = t(e.dataset.i18nTitle);
  for (const e of document.querySelectorAll("[data-i18n-aria]")) e.setAttribute("aria-label", t(e.dataset.i18nAria));
  for (const b of document.querySelectorAll("[data-ui]")) b.setAttribute("aria-pressed", b.dataset.ui === ui);
}
applyLang();

const RING = 245; // omtrek van de voortgangsring

let book = null;
let idx = 0;
let loaded = new Map();   // zin-index -> Promise<{words, nl, url}>
let wordEls = [];
let current = null;       // gegevens van de getoonde zin
let failed = false;
let autoAdvance = false;  // na afloop vanzelf door naar de volgende zin?
let token = 0;            // voorkomt dat een trage laadactie een nieuwere zin overschrijft
let lastActive = -1;

// --- Laden ------------------------------------------------------------------

function load(i) {
  if (!loaded.has(i)) {
    const p = (async () => {
      const res = await fetch(`/api/books/${book.id}/sentence/${i}?tr=${glossLang()}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      // Als blob laden, zodat terugspoelen altijd werkt.
      const blob = await (await fetch(data.audio)).blob();
      return { ...data, url: URL.createObjectURL(blob) };
    })();
    p.catch(() => loaded.delete(i)); // na een fout opnieuw kunnen proberen
    loaded.set(i, p);
  }
  return loaded.get(i);
}

function renderWords(words) {
  wordEls = words.map((w, k) => {
    const el = document.createElement("span");
    el.className = "w";
    el.style.animationDelay = `${Math.min(k * 14, 420)}ms`;
    const src = document.createElement("span");
    src.className = "src";
    src.textContent = w.t;
    const nl = document.createElement("span");
    nl.className = "nl";
    nl.textContent = w.tr ?? "";
    el.append(src, nl);
    return el;
  });
  $("words").replaceChildren(...wordEls);
}

async function show(i, { play }) {
  const my = ++token;
  audio.pause();
  audio.removeAttribute("src");
  idx = i;
  localStorage.setItem(`pos:${book.id}`, i);
  current = null;
  failed = false;
  lastActive = -1;

  const n = book.sentences.length;
  // De tekst staat er meteen; audio en vertaling volgen zodra ze geladen zijn.
  renderWords(book.sentences[i].split(" ").map((t) => ({ t })));
  $("words").className = "pending";
  $("ctxPrev").textContent = book.sentences[i - 1] ?? "";
  $("ctxNext").textContent = book.sentences[i + 1] ?? "";
  $("full").className = "";
  $("full").textContent = "";
  $("status").textContent = "";
  $("ring").style.strokeDashoffset = RING;
  $("seek").value = i;
  $("seek").style.setProperty("--fill", `${n > 1 ? (i / (n - 1)) * 100 : 100}%`);
  $("bar").style.width = `${((i + 1) / n) * 100}%`;
  $("count").textContent = `${i + 1} / ${n}`;
  $("meta").textContent = `${langName(book.lang)} · ${Math.round(((i + 1) / n) * 100)}%`;
  window.scrollTo({ top: 0 });
  updateButtons();

  let s;
  try {
    s = await load(i);
  } catch (e) {
    if (my !== token) return;
    failed = true;
    $("words").className = "";
    $("status").textContent = e.message;
    updateButtons();
    return;
  }
  if (my !== token) return;

  current = s;
  $("words").className = "";
  if (s.words.length !== wordEls.length) renderWords(s.words);
  s.words.forEach((w, k) => {
    wordEls[k].lastChild.textContent = w.tr;
    wordEls[k].classList.toggle("verb", !!w.verb);
    wordEls[k].verb = w.verb;
  });
  $("full").textContent = s.tr;
  audio.src = s.url;
  updateButtons();

  if (play) start({ muted: false, advance: true });
  if (i + 1 < n) load(i + 1).catch(() => {}); // alvast klaarzetten
}

// --- Afspelen ---------------------------------------------------------------

function start({ muted, advance }) {
  if (!current) return;
  autoAdvance = advance;
  audio.muted = muted;
  audio.currentTime = 0;
  audio.play();
}

function tick() {
  if (current && !audio.paused) {
    const t = audio.currentTime;
    let active = -1;
    current.words.forEach((w, k) => {
      const el = wordEls[k];
      const now = t >= w.start && t < w.end;
      el.classList.toggle("now", now);
      if (now) {
        active = k;
        el.style.setProperty("--p", (t - w.start) / (w.end - w.start));
      }
      if (t >= w.start) el.classList.add("seen"); // Nederlands blijft daarna staan
    });
    if (active !== -1 && active !== lastActive) {
      lastActive = active;
      wordEls[active].scrollIntoView({ block: "nearest" }); // lange zinnen: woord in beeld houden
    }
    if (audio.duration) $("ring").style.strokeDashoffset = RING * (1 - t / audio.duration);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

audio.addEventListener("ended", () => {
  wordEls.forEach((el) => { el.classList.remove("now"); el.classList.add("seen"); });
  $("ring").style.strokeDashoffset = 0;
  $("full").className = "show";
  updateButtons();
  if (autoAdvance && !$("stopEach").checked) next();
});
audio.addEventListener("play", updateButtons);
audio.addEventListener("pause", updateButtons);

function updateButtons() {
  const ready = !!current;
  const last = book && idx >= book.sentences.length - 1;
  const state = !audio.paused ? (audio.muted ? "silent" : "playing") : "idle";
  document.body.dataset.state = state;
  $("badgeText").textContent =
    t(failed ? "failed"
    : !ready ? "loading"
    : state === "playing" ? "playing"
    : state === "silent" ? "yourTurn"
    : audio.ended ? (last ? "end" : "spaceNext")
    : audio.currentTime > 0 ? "paused"
    : "spacePlay");
  $("toggle").disabled = $("silent").disabled = $("again").disabled = !ready;
  $("prev").disabled = idx === 0;
  $("next").disabled = last;
}

function toggle() {
  if (!current) return;
  if (!audio.paused) audio.pause();
  else if (audio.ended) {
    // Zin is klaar: door naar de volgende (of de laatste zin opnieuw).
    if (idx < book.sentences.length - 1) next();
    else start({ muted: false, advance: true });
  } else if (audio.currentTime > 0) audio.play(); // hervatten waar je was
  else start({ muted: false, advance: true });
}
const next = () => idx < book.sentences.length - 1 && show(idx + 1, { play: true });
const prev = () => idx > 0 && show(idx - 1, { play: true });
const silent = () => start({ muted: true, advance: false });
const again = () => start({ muted: false, advance: false });

$("toggle").onclick = toggle;
$("next").onclick = $("ctxNext").onclick = next;
$("prev").onclick = $("ctxPrev").onclick = prev;
$("silent").onclick = silent;
$("again").onclick = again;
$("seek").oninput = (e) => {
  const n = book.sentences.length;
  $("count").textContent = `${Number(e.target.value) + 1} / ${n}`;
  e.target.style.setProperty("--fill", `${n > 1 ? (e.target.value / (n - 1)) * 100 : 100}%`);
};
$("seek").onchange = (e) => show(Number(e.target.value), { play: false });

document.addEventListener("keydown", (e) => {
  if ($("player").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const keys = { " ": toggle, ArrowRight: next, ArrowLeft: prev, s: silent, r: again };
  const fn = keys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!fn) return;
  e.preventDefault();
  document.activeElement.blur(); // voorkomt dubbel afvuren op een gefocuste knop
  fn();
});

// --- Vervoegingen bij werkwoorden --------------------------------------------

const PERSONS = {
  fr: ["je", "tu", "il/elle", "nous", "vous", "ils/elles"],
  es: ["yo", "tú", "él/ella", "nos.", "vos.", "ellos"],
};
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};

function showPop(wordEl) {
  const v = wordEl.verb;
  // Vorm in de tekst zonder leestekens en voorvoegsels: "qu'elle" -> "elle", "dit-il," -> "dit".
  const form = wordEl.firstChild.textContent.toLowerCase()
    .replace(/^[^\p{L}]+|[^\p{L}]+$/gu, "").split(/['’]/).pop().split("-")[0];

  const h = el("h3", v.inf);
  h.append(el("small", t("verb")));
  const grid = el("div", null, "grid");
  for (const t of v.tenses) {
    const ul = el("ul");
    t.forms.forEach((f, p) => {
      const li = el("li", null, f === form ? "hit" : "");
      li.append(el("span", PERSONS[book.lang][p]), f === "NA" ? "–" : f);
      ul.append(li);
    });
    const col = el("div");
    col.append(el("h4", t.name), ul);
    grid.append(col);
  }
  const pop = $("pop");
  pop.replaceChildren(h, grid);
  if (v.extra.length) {
    const extra = el("p", null, "extra");
    v.extra.forEach(([name, f], k) => extra.append(k ? " · " : "", `${name} `, el("b", f, [f, f + "e", f + "s", f + "es"].includes(form) ? "hit" : "")));
    pop.append(extra);
  }

  // Onder het woord, of erboven als daar geen ruimte is (de bedieningsbalk zit onderaan).
  pop.hidden = false;
  const r = wordEl.getBoundingClientRect(), p = pop.getBoundingClientRect();
  const below = $("dock").getBoundingClientRect().top - r.bottom - 16, above = r.top - 16;
  const top = p.height <= below || (p.height > above && below > above) ? r.bottom + 8 : r.top - p.height - 8;
  pop.style.top = `${Math.max(8, top)}px`;
  pop.style.left = `${Math.max(12, Math.min(r.left + r.width / 2 - p.width / 2, innerWidth - p.width - 12))}px`;
}

$("words").addEventListener("mouseover", (e) => {
  const w = e.target.closest(".w.verb");
  if (w) showPop(w);
});
$("words").addEventListener("mouseout", (e) => {
  if (e.target.closest(".w.verb")) $("pop").hidden = true;
});
window.addEventListener("scroll", () => { $("pop").hidden = true; }, { passive: true });

// --- Boek kiezen ------------------------------------------------------------

const savedPos = (id) => Number(localStorage.getItem(`pos:${id}`)) || 0;

async function openPlayer(id) {
  const res = await fetch(`/api/books/${id}`);
  if (!res.ok) return openSetup(); // boek bestaat niet meer
  book = await res.json();
  localStorage.setItem("book", id);
  loaded = new Map();
  $("setup").hidden = true;
  $("player").hidden = $("dock").hidden = $("otherBook").hidden = false;
  $("seek").max = book.sentences.length - 1;
  show(Math.min(savedPos(id), book.sentences.length - 1), { play: false });
}

async function openSetup() {
  audio.pause();
  localStorage.removeItem("book");
  $("player").hidden = $("dock").hidden = $("otherBook").hidden = true;
  $("setup").hidden = false;
  $("meta").textContent = "";
  $("bar").style.width = 0;

  const books = await (await fetch("/api/books")).json();
  $("setupStatus").textContent = books.length ? "" : t("noBooks");
  $("books").replaceChildren(...books.map((b) => {
    const btn = el("button", null, "book");
    const left = el("div");
    const langs = `${langName(b.lang)} → ${b.targets.map(langName).join(", ")}`;
    left.append(el("b", b.title), el("span", `${langs} · ${b.count} ${t("sentences")}`));
    btn.append(left, el("i", savedPos(b.id) ? t("resume", { n: savedPos(b.id) + 1 }) : t("start")));
    btn.onclick = () => openPlayer(b.id);
    return btn;
  }));
}

$("otherBook").onclick = openSetup;

// Andere paginataal: teksten omzetten en, als je aan het lezen bent, de zin opnieuw laden
// (de vertaling onder de woorden kan dan in een andere taal komen).
for (const b of document.querySelectorAll("[data-ui]")) {
  b.onclick = () => {
    if (b.dataset.ui === ui) return;
    ui = b.dataset.ui;
    try { localStorage.setItem("ui", ui); } catch {}
    applyLang();
    if (!$("player").hidden) {
      loaded = new Map();
      show(idx, { play: false });
    } else openSetup();
  };
}

// Terug naar het boek waar je mee bezig was, anders de lijst met boeken.
if (localStorage.getItem("book")) openPlayer(localStorage.getItem("book"));
else openSetup();
</script>
