<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voix — admin</title>
<style>
  :root {
    --paper: #f5efe3; --paper-2: #fbf7ee; --ink: #1e1a15; --ink-soft: #8d8576; --line: #e2d9c7;
    --accent: #b8472a; --accent-ink: #fff; --bad: #c0392b;
    --shadow: 0 18px 50px -18px rgba(60, 40, 10, .35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #13110e; --paper-2: #1c1915; --ink: #f0e9dc; --ink-soft: #857d6f; --line: #302b24;
      --accent: #ef8f5e; --accent-ink: #1a0f08; --bad: #ff8a7a;
      --shadow: 0 18px 50px -18px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 var(--sans); background: var(--paper);
         -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: default; opacity: .4; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           max-width: 820px; margin: 0 auto; padding: 22px 24px 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; font: 600 1.35rem/1 var(--serif); }
  .brand em { font: 500 .72rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase;
              color: var(--ink-soft); font-style: normal; }
  .brand b { color: var(--accent); }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .chip { display: inline-flex; align-items: center; padding: 7px 14px; border-radius: 999px; cursor: pointer;
          border: 1px solid var(--line); background: var(--paper-2); font-size: .82rem; text-decoration: none;
          color: inherit; }
  .chip:hover { border-color: var(--accent); }
  .uilang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .uilang button { padding: 4px 9px; border-radius: 999px; font: 600 .7rem var(--sans); letter-spacing: .06em;
                   color: var(--ink-soft); }
  .uilang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  main { max-width: 820px; margin: 0 auto; padding: 5vh 24px 80px; }
  h2 { font: 500 1.6rem/1.2 var(--serif); margin: 44px 0 6px; }
  h2:first-child { margin-top: 0; }
  .lead { color: var(--ink-soft); margin: 0 0 18px; max-width: 62ch; }

  .card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 22px; padding: 22px;
          box-shadow: var(--shadow); }
  .card-top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  #title { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--paper); font: 1.05rem var(--serif); }
  select { padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
  .field { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--ink-soft); }
  fieldset { margin: 16px 0 0; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 8px; font-size: .84rem; color: var(--ink-soft); }
  #targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px;
             font-size: .88rem; }
  #targets label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  #targets label.off { opacity: .35; cursor: default; }
  #drop { margin-top: 16px; border: 1.5px dashed var(--line); border-radius: 16px; }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  #text { display: block; width: 100%; height: 200px; padding: 18px; border: 0; background: none; resize: vertical;
          font: 1.05rem/1.6 var(--serif); outline: none; }
  #text::placeholder, #title::placeholder { color: var(--ink-soft); }
  .card-bot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 18px; }
  .cta { padding: 11px 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #addStatus { color: var(--ink-soft); font-size: .88rem; }

  #books { display: grid; gap: 12px; }
  .book { padding: 18px 22px; }
  .book-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .book b { display: block; font: 600 1.15rem/1.3 var(--serif); }
  .book small { font-size: .84rem; color: var(--ink-soft); }
  .bar { height: 4px; margin: 14px 0 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .state { margin: 0; font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .err { margin: 6px 0 0; font-size: .84rem; color: var(--bad); white-space: pre-wrap; }
  #empty { color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div class="brand">Voix<b>.</b> <em data-i18n="tagline"></em></div>
  <div class="head-right">
    <a class="chip" href="/" data-i18n="toBooks"></a>
    <div class="uilang" role="group" aria-label="Language / Taal">
      <button data-ui="nl">NL</button><button data-ui="en">EN</button>
    </div>
  </div>
</header>

<main>
  <h2 data-i18n="newBook"></h2>
  <p class="lead" data-i18n-html="newLead"></p>
  <div class="card">
    <div class="card-top">
      <input id="title" data-i18n-placeholder="titlePh" data-i18n-aria="titlePh">
      <label class="field"><span data-i18n="bookLang"></span> <select id="lang"></select></label>
      <label class="chip"><span data-i18n="pickFile"></span>
        <input type="file" id="file" accept=".txt,text/plain" hidden></label>
    </div>
    <fieldset>
      <legend data-i18n="targetsLegend"></legend>
      <div id="targets"></div>
    </fieldset>
    <div id="drop">
      <textarea id="text" data-i18n-placeholder="textPh"></textarea>
    </div>
    <div class="card-bot">
      <button class="cta" id="add" data-i18n="add"></button>
      <span id="addStatus"></span>
    </div>
  </div>

  <h2 data-i18n="books"></h2>
  <p id="empty" data-i18n="noBooks" hidden></p>
  <div id="books"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);

// --- Taal van de pagina (Nederlands of Engels) -------------------------------

const TEXT = {
  nl: {
    tagline: "beheer", toBooks: "Naar de boeken", newBook: "Nieuw boek", books: "Boeken",
    newLead: "Een boek toevoegen kost nog niets. Pas bij <b>Verwerken</b> wordt elke zin omgezet naar spraak " +
      "(ElevenLabs, per teken) en vertaald (Claude, per vertaaltaal). Bezoekers zien een boek zodra de eerste zinnen klaar zijn.",
    titlePh: "Titel van het boek", bookLang: "Taal van het boek", pickFile: "Kies een .txt-bestand",
    targetsLegend: "Vertalen naar (elke taal kost extra tokens)",
    textPh: "Plak hier de tekst, of sleep een .txt-bestand in dit vak…",
    add: "Boek toevoegen", busy: "Bezig…", added: "Toegevoegd. Klik hieronder op Verwerken om het boek om te zetten.",
    needTitle: "Geef het boek een titel.", needText: "Plak eerst de tekst.", needTarget: "Kies minstens één vertaaltaal.",
    noBooks: "Er zijn nog geen boeken.", sentences: "zinnen",
    process: "Verwerken", resume: "Verder verwerken", stop: "Stop",
    complete: "Klaar: het hele boek staat in de cache.",
    progress: "{done} van {total} zinnen klaar · nog {chars} tekens naar ElevenLabs", running: "bezig…",
    error: "Gestopt door een fout. {msg}",
  },
  en: {
    tagline: "admin", toBooks: "To the books", newBook: "New book", books: "Books",
    newLead: "Adding a book costs nothing yet. Only <b>Process</b> turns each sentence into speech " +
      "(ElevenLabs, per character) and translates it (Claude, per translation language). Visitors see a book as soon as the first sentences are done.",
    titlePh: "Title of the book", bookLang: "Language of the book", pickFile: "Choose a .txt file",
    targetsLegend: "Translate into (each language costs extra tokens)",
    textPh: "Paste the text here, or drop a .txt file in this box…",
    add: "Add book", busy: "Working…", added: "Added. Click Process below to convert the book.",
    needTitle: "Give the book a title.", needText: "Paste the text first.", needTarget: "Choose at least one translation language.",
    noBooks: "There are no books yet.", sentences: "sentences",
    process: "Process", resume: "Continue processing", stop: "Stop",
    complete: "Done: the whole book is in the cache.",
    progress: "{done} of {total} sentences done · {chars} characters left for ElevenLabs", running: "working…",
    error: "Stopped by an error. {msg}",
  },
};
let ui = "nl";
try { if (TEXT[localStorage.getItem("ui")]) ui = localStorage.getItem("ui"); } catch {}
const t = (key, vars = {}) => TEXT[ui][key].replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const langName = (code) => new Intl.DisplayNames([ui], { type: "language" }).of(code);
const num = (n) => n.toLocaleString(ui);

function applyLang() {
  document.documentElement.lang = ui;
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-html]")) e.innerHTML = t(e.dataset.i18nHtml);
  for (const e of document.querySelectorAll("[data-i18n-placeholder]")) e.placeholder = t(e.dataset.i18nPlaceholder);
  for (const e of document.querySelectorAll("[data-i18n-aria]")) e.setAttribute("aria-label", t(e.dataset.i18nAria));
  for (const b of document.querySelectorAll("[data-ui]")) b.setAttribute("aria-pressed", b.dataset.ui === ui);
}

const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};

const post = (url, body) =>
  fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });

// --- Talen kiezen ------------------------------------------------------------

let languages = [];

// Taalnamen in de taal van de pagina, alfabetisch. De keuzes blijven staan bij een andere paginataal.
function renderLanguages() {
  const lang = $("lang").value || "fr";
  const checked = new Set([...document.querySelectorAll("#targets input:checked")].map((i) => i.value));
  if (!document.querySelector("#targets input")) checked.add(ui === "en" ? "en" : "nl");
  const sorted = [...languages].sort((a, b) => langName(a).localeCompare(langName(b), ui));

  $("lang").replaceChildren(...sorted.map((c) => new Option(langName(c), c)));
  $("lang").value = lang;
  $("targets").replaceChildren(...sorted.map((c) => {
    const box = el("input");
    box.type = "checkbox";
    box.value = c;
    box.checked = checked.has(c);
    const label = el("label");
    label.append(box, langName(c));
    return label;
  }));
  updateTargets();
}

// Naar de taal van het boek zelf vertalen heeft geen zin.
function updateTargets() {
  for (const box of document.querySelectorAll("#targets input")) {
    box.disabled = box.value === $("lang").value;
    box.parentElement.classList.toggle("off", box.disabled);
  }
}
$("lang").onchange = updateTargets;

// --- Boeken ------------------------------------------------------------------

let timer;

async function refresh() {
  clearTimeout(timer);
  const books = await (await fetch("/admin/api/books")).json();
  $("empty").hidden = books.length > 0;
  $("books").replaceChildren(...books.map((b) => {
    const card = el("div", null, "card book");
    const top = el("div", null, "book-top");
    const left = el("div");
    const langs = `${langName(b.lang)} → ${b.targets.map(langName).join(", ")}`;
    left.append(el("b", b.title), el("small", `${langs} · ${num(b.total)} ${t("sentences")}`));

    const complete = b.done === b.total;
    const btn = el("button", t(b.running ? "stop" : b.done ? "resume" : "process"), "chip");
    btn.hidden = complete && !b.running;
    btn.onclick = async () => {
      btn.disabled = true;
      await post(`/admin/api/books/${b.id}/${b.running ? "stop" : "process"}`);
      refresh();
    };
    top.append(left, btn);

    const bar = el("div", null, "bar");
    const fill = el("i");
    fill.style.width = `${(b.done / b.total) * 100}%`;
    bar.append(fill);

    const state = complete ? t("complete")
      : t("progress", { done: num(b.done), total: num(b.total), chars: num(b.todoChars) }) +
        (b.running ? ` · ${t("running")}` : "");
    card.append(top, bar, el("p", state, "state"));
    if (b.error) card.append(el("p", t("error", { msg: b.error }), "err"));
    return card;
  }));
  if (books.some((b) => b.running)) timer = setTimeout(refresh, 2000);
}

const readFile = async (f) => {
  if (!f) return;
  $("text").value = await f.text();
  if (!$("title").value) $("title").value = f.name.replace(/\.[^.]+$/, "");
};
$("file").onchange = (e) => readFile(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").className = "over"; };
$("drop").ondragleave = () => { $("drop").className = ""; };
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").className = ""; readFile(e.dataTransfer.files[0]); };

$("add").onclick = async () => {
  const targets = [...document.querySelectorAll("#targets input:checked:not(:disabled)")].map((i) => i.value);
  const problem = !$("title").value.trim() ? "needTitle" : !$("text").value.trim() ? "needText"
    : !targets.length ? "needTarget" : null;
  if (problem) return ($("addStatus").textContent = t(problem));
  $("addStatus").textContent = t("busy");
  const res = await post("/admin/api/books", { title: $("title").value, text: $("text").value, lang: $("lang").value, targets });
  const data = await res.json();
  if (!res.ok) return ($("addStatus").textContent = data.error);
  $("addStatus").textContent = t("added");
  $("title").value = $("text").value = "";
  refresh();
};

for (const b of document.querySelectorAll("[data-ui]")) {
  b.onclick = () => {
    ui = b.dataset.ui;
    try { localStorage.setItem("ui", ui); } catch {}
    applyLang();
    renderLanguages();
    refresh();
  };
}

applyLang();
fetch("/admin/api/languages").then((r) => r.json()).then((l) => { languages = l; renderLanguages(); });
refresh();
</script>
</body>
</html>
